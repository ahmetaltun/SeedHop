name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Socket and discovery fixtures share the small hosted runner's CPU budget.
      RUST_TEST_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Select native toolchain
        run: |
          test "$(uname -m)" = arm64
          sudo xcode-select --switch /Applications/Xcode_26.3.app
          rustup show active-toolchain
          rustup target add aarch64-apple-darwin
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'vendor/rqbit/**/*.rs') }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-xcode26.3-
      - name: Rust and packaging checks
        id: rust-checks
        run: |
          make test
          make lint
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/localization.py check
      - name: Build native development app
        run: python3 scripts/build.py --identity -
      - name: Native and localization checks
        run: |
          .build/SeedHop.app/Contents/MacOS/SeedHop --verify-ux -ApplePersistenceIgnoreState YES
          .build/SeedHop.app/Contents/MacOS/SeedHop --verify-interface -ApplePersistenceIgnoreState YES --output "$PWD/.build/interface-navigation.png"
          .build/SeedHop.app/Contents/MacOS/SeedHop --verify-workspace-layout -ApplePersistenceIgnoreState YES
          .build/SeedHop.app/Contents/MacOS/SeedHop --verify-menus -ApplePersistenceIgnoreState YES
          python3 scripts/verify_localizations.py
      - name: Save validated Rust cache even if a native fixture fails
        if: always() && steps.rust-checks.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
