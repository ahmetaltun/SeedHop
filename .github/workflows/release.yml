name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag (v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 185
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      BUILD_NUMBER: ${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Select native toolchain
        run: |
          test "$(uname -m)" = arm64
          sudo xcode-select --switch /Applications/Xcode_26.3.app
          rustup show active-toolchain
          rustup target add aarch64-apple-darwin
      - name: Validate release tag before accessing signing secrets
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          import release
          if getattr(release, 'PHASES', None) != ('build', 'app', 'dmg', 'finalize'):
              raise SystemExit('This tag contains the old release scripts. Tag the updated pipeline commit before running this workflow.')
          release.preflight(os.environ['RELEASE_TAG'], os.environ['BUILD_NUMBER'])
          PY
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: build-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .cache/sparkle
          key: release-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'vendor/rqbit/**/*.rs') }}
          restore-keys: |
            release-${{ runner.os }}-${{ runner.arch }}-xcode26.3-
            native-${{ runner.os }}-${{ runner.arch }}-xcode26.3-
      - name: Build and sign optimized app
        timeout-minutes: 45
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python3 -u scripts/release.py --phase build --tag "$RELEASE_TAG" --build-number "$BUILD_NUMBER"
      - name: Save compiled dependencies before notarization
        if: always() && steps.build-cache.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .cache/sparkle
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Notarize and staple app
        timeout-minutes: 60
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python3 -u scripts/release.py --phase app --tag "$RELEASE_TAG" --build-number "$BUILD_NUMBER"
      - name: Create, sign, notarize, and verify DMG
        timeout-minutes: 65
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python3 -u scripts/release.py --phase dmg --tag "$RELEASE_TAG" --build-number "$BUILD_NUMBER"
      - name: Create signed ZIP, appcast, and checksums
        timeout-minutes: 10
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python3 -u scripts/release.py --phase finalize --tag "$RELEASE_TAG" --build-number "$BUILD_NUMBER"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          overwrite: true
          path: .build/release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Retain failed notarization results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notarization-diagnostics
          overwrite: true
          path: .build/release/*notary*.json
          if-no-files-found: ignore
          retention-days: 7

  draft:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Create or refresh draft only
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          tag = os.environ['RELEASE_TAG']
          result = subprocess.run(['gh', 'api', f'repos/{os.environ["GH_REPO"]}/releases/tags/{tag}'], capture_output=True)
          existing = None
          if result.returncode == 0:
              existing = json.loads(result.stdout)
              if not existing['draft']:
                  raise SystemExit('Refusing to overwrite a published release')
          elif b'404' not in result.stderr:
              raise SystemExit('Could not inspect existing release')
          notes = pathlib.Path('release-notes.md')
          notes.write_text('SeedHop ' + tag[1:] + '\n\nmacOS 15+, Apple Silicon.\n\n'
                           'Signed and notarized. Manual release acceptance remains pending. '
                           'Complete docs/RELEASE-VALIDATION.md before publishing.\n\n'
                           'The update feed becomes public when this stable release is published.\n')
          assets = sorted(str(p) for p in pathlib.Path('release-assets').iterdir() if p.is_file())
          if existing:
              subprocess.run(['gh', 'release', 'upload', tag, '--clobber', *assets], check=True)
          else:
              subprocess.run(['gh', 'release', 'create', tag, '--verify-tag', '--draft', '--title', 'SeedHop ' + tag[1:],
                              '--notes-file', str(notes), *assets], check=True)
          PY
