[workspace]
resolver = "2"
members = ["crates/seedhop-core", "crates/seedhop-ffi"]
exclude = ["vendor/rqbit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
librqbit = { path = "vendor/rqbit/crates/librqbit", default-features = false, features = ["rust-tls"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util"] }
uniffi = { version = "=0.32.2", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1

# The native development app transfers real data. Keep its engine and stream
# cipher optimized while retaining debug symbols and assertions.
[profile.dev.package.librqbit]
opt-level = 2

[profile.dev.package.rc4]
opt-level = 3

[profile.dev.package.cipher]
opt-level = 3
